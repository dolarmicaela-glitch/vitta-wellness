name: Sincronizar VITTA CMS

on:
  push:
    branches: [main]
    paths:
      - 'content/site.json'
      - '.github/workflows/vitta-cms-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar contenido del CMS al sitio
        shell: python
        run: |
          import json, re
          from pathlib import Path

          site = json.loads(Path('content/site.json').read_text(encoding='utf-8'))

          # -----------------------------
          # WEB PRINCIPAL: index.html
          # -----------------------------
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Quitar cualquier intento anterior de cargar el puente JS.
          html = html.replace('<script src="vitta-admin.js"></script>', '')

          def replace_one(pattern, value, text, flags=0):
              if value is None or value == '':
                  return text
              return re.sub(pattern, lambda m: m.group(1) + str(value) + m.group(2), text, count=1, flags=flags)

          # Portada
          html = replace_one(r'(<p class="hero-eyebrow">).*?(</p>)', site.get('hero_eyebrow'), html)
          html = replace_one(r'(<h1 class="hero-title">\s*).*?(\s*</h1>)', site.get('hero_title'), html, re.S)
          html = replace_one(r'(<p class="hero-sub">).*?(</p>)', site.get('hero_subtitle'), html, re.S)

          # Sobre mí
          about_values = [site.get('about_1'), site.get('about_2'), site.get('about_3')]
          about_pattern = re.compile(r'(<p class="about-body" contenteditable="true">).*?(</p>)', re.S)
          matches = list(about_pattern.finditer(html))
          for i in range(min(3, len(matches)) - 1, -1, -1):
              v = about_values[i]
              if v is not None and v != '':
                  m = matches[i]
                  html = html[:m.start()] + m.group(1) + str(v) + m.group(2) + html[m.end():]

          # Estadísticas
          stat_values = [site.get('stat_people'), site.get('stat_years'), site.get('stat_programs')]
          stat_pattern = re.compile(r'(<div class="stat-number" contenteditable="true">).*?(</div>)', re.S)
          matches = list(stat_pattern.finditer(html))
          for i in range(min(3, len(matches)) - 1, -1, -1):
              v = stat_values[i]
              if v is not None and v != '':
                  m = matches[i]
                  html = html[:m.start()] + m.group(1) + str(v) + m.group(2) + html[m.end():]

          # Precios: 7 planes + VITTA Reset
          price_values = [site.get(f'price_plan_{i}') for i in range(1, 8)] + [site.get('price_vitta_reset')]
          price_pattern = re.compile(r'(<div class="plan-price"[^>]*>).*?(</div>)', re.S)
          matches = list(price_pattern.finditer(html))
          for i in range(min(len(price_values), len(matches)) - 1, -1, -1):
              v = price_values[i]
              if v is not None and v != '':
                  m = matches[i]
                  html = html[:m.start()] + m.group(1) + str(v) + m.group(2) + html[m.end():]

          # Botones principales
          html = replace_one(r'(<a href="#planes" class="btn-primary">).*?(</a>)', site.get('main_cta_text'), html, re.S)
          html = replace_one(r'(<a href="#contacto" class="btn-outline">).*?(</a>)', site.get('consult_cta_text'), html, re.S)
          html = replace_one(r'(<a href="#contacto" class="nav-cta">).*?(</a>)', site.get('consult_cta_text'), html, re.S)

          # WhatsApp
          whatsapp = site.get('whatsapp')
          if whatsapp:
              html = re.sub(r'wa\.me/\d+', 'wa.me/' + str(whatsapp), html)

          # Instagram
          instagram = site.get('instagram')
          if instagram:
              html = re.sub(r'href="https?://(?:www\.)?instagram\.com/[^"]*"', 'href="' + str(instagram) + '"', html)

          p.write_text(html, encoding='utf-8')

          # -----------------------------
          # LANDING VITTA RESET
          # -----------------------------
          reset_path = Path('vitta-reset.html')
          reset_html = reset_path.read_text(encoding='utf-8')
          reset_price = site.get('price_vitta_reset')

          if reset_price is not None and reset_price != '':
              # Precio del hero
              reset_html = re.sub(
                  r'(<span class="hero-precio-ahora">\$).*?( ARS</span>)',
                  lambda m: m.group(1) + str(reset_price) + m.group(2),
                  reset_html, count=1, flags=re.S
              )

              # Bloque principal de precio
              reset_html = re.sub(
                  r'(<span id="precio-landing" contenteditable="true">).*?(</span>)',
                  lambda m: m.group(1) + str(reset_price) + m.group(2),
                  reset_html, count=1, flags=re.S
              )

              # CTA intermedio
              reset_html = re.sub(
                  r'(Obtener todo por \$<span contenteditable="true">).*?(</span> ARS →)',
                  lambda m: m.group(1) + str(reset_price) + m.group(2),
                  reset_html, count=1, flags=re.S
              )

              # Comparación de valor
              reset_html = re.sub(
                  r'(<div class="valor-vitta-price">\$).*?(</div>)',
                  lambda m: m.group(1) + str(reset_price) + m.group(2),
                  reset_html, count=1, flags=re.S
              )

              # CTA final
              reset_html = re.sub(
                  r'(<div class="final-price"><span>\$</span> <span contenteditable="true">).*?(</span> ARS</div>)',
                  lambda m: m.group(1) + str(reset_price) + m.group(2),
                  reset_html, count=1, flags=re.S
              )

          reset_path.write_text(reset_html, encoding='utf-8')

      - name: Guardar cambios en la web
        run: |
          if git diff --quiet -- index.html vitta-reset.html; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git config user.name "VITTA CMS"
          git config user.email "actions@users.noreply.github.com"
          git add index.html vitta-reset.html
          git commit -m "Actualizar web y landing desde Pages CMS"
          git push
