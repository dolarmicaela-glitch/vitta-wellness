<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Configuración privada · VITTA</title>
<style>*{box-sizing:border-box}body{background:#fbf8f4;color:#3d2b1f;font:16px/1.6 system-ui;margin:0}main{max-width:620px;margin:50px auto;padding:25px}h1{font-family:Georgia,serif;font-weight:400}label{display:block;margin:22px 0}input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #bca892;border-radius:5px}button{padding:16px;border:0;background:#3d2b1f;color:white;border-radius:5px;font:inherit;cursor:pointer}button:disabled{opacity:.6}output{display:block;margin-top:25px;white-space:pre-wrap}</style>
</head><body><main><h1>Configuración privada de VITTA</h1><p>Carga inicial del programa. Solo disponible con la clave privada de configuración; se deshabilita al finalizar.</p>
<form id="upload-form"><label>Clave de configuración<input id="upload-key" type="password" autocomplete="off" required></label><label>Programa completo ZIP<input id="upload-zip" type="file" accept=".zip" required></label><label>Semanas del programa<input id="upload-weeks" type="file" accept=".json" required></label><button id="upload-button" type="submit">Guardar programa privado</button></form><output id="upload-status" role="status" aria-live="polite"></output></main><script src="assets/vitta-setup.js"></script></body></html>
